name: GFS run

on:
  schedule:
    # Run 7 hours after each GFS cycle, when all 72 hourly files are on
    # NOMADS: 01 UTC -> yesterday 18z, 07 -> 00z, 13 -> 06z, 19 -> 12z.
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write   # needed to push the generated JSON back to the repo

concurrency:
  # never let a scheduled run and a manual one fight over the same branch
  group: gfs-run
  cancel-in-progress: false

env:
  PYTHONFAULTHANDLER: "1"
  # output stems produced by gfs_download.VARIABLES
  VARS: >-
    tmp_surf,dpt_surf,rh_surf,u10,v10,prmsl,
    tmax_surf,tmin_surf,apcp,prate,cprat,tcdc,
    rh_p850,u_p850,v_p850,gh_p850,
    rh_p500,u_p500,v_p500,gh_p500,
    rh_p200,u_p200,v_p200,gh_p200

jobs:
  run-preprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check runner resources
        run: |
          echo "CPU cores:"
          nproc
          echo "Memory:"
          free -h
          echo "Disk:"
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # full history: the commit step pulls and merges before pushing
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve the cycle
        run: |
          # Pick the newest cycle that is at least 7 hours old. This works for
          # the 01/07/13/19 schedule and for manual runs at any hour:
          #   01 -> yesterday 18z, 07 -> 00z, 13 -> 06z, 19 -> 12z
          RUN_HOUR=$(date -u +%-H)
          LAG_HOUR=$(( (RUN_HOUR - 7 + 24) % 24 ))
          CYCLE=$(printf '%02d' $(( LAG_HOUR / 6 * 6 )))
          if [ "$RUN_HOUR" -lt 7 ]; then
            YMD=$(date -u -d 'yesterday' +%Y%m%d)
          else
            YMD=$(date -u +%Y%m%d)
          fi

          # Make sure the whole 72-hour range exists before starting the
          # 15-minute download. f000 alone can be up 3-4 hours early.
          if ! curl -sIL --max-time 15 -o /dev/null -w "%{http_code}" \
            "https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.${YMD}/${CYCLE}/atmos/gfs.t${CYCLE}z.pgrb2.0p25.f072" | grep -q 200; then
            echo "::error::GFS ${YMD} ${CYCLE}z f072 is not available yet"
            exit 1
          fi

          echo "YMD=$YMD" >> "$GITHUB_ENV"
          echo "CYCLE=$CYCLE" >> "$GITHUB_ENV"
          echo "cycle: $YMD ${CYCLE}z"

      - name: Download, crop and convert to JSON
        run: |
          set -euo pipefail

          # start from a clean slate: a different number of parts would
          # otherwise leave stale *_part03of03.json files behind
          mkdir -p GFS
          find GFS -maxdepth 1 -type f -name '*.json' -delete

          # download via the project's curl script (variable-wise, hourly)
          # into GFS/, which is where gfs_download.py reads from
          ( cd GFS && bash ../download_gfs_curl.sh "$YMD" "$CYCLE" 0 72 )

          python -X faulthandler gfs_download.py \
            --skip-download \
            --date "$YMD" --cycle "$CYCLE" \
            --max-lead 72 --lead-every 1 \
            --vars "$VARS" \
            --out GFS --max-json-mb 15

          n=$(find GFS -maxdepth 1 -type f -name '*.json' | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "no JSON was produced - failing instead of committing nothing"
            exit 1
          fi
          echo "$n JSON file(s) in GFS/"
          du -sh GFS/

          # GitHub's web uploader refuses files over 25 MB. --max-json-mb 15
          # keeps every part below that; warn if that ever breaks.
          big=$(find GFS -maxdepth 1 -type f -name '*.json' -size +25M)
          if [ -n "$big" ]; then
            echo "::warning::JSON files larger than 25 MB:"
            echo "$big"
          fi

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "subhrajitjubu"
          git config --global user.email "66462700+subhrajitjubu@users.noreply.github.com"
          git pull --no-rebase origin main

          # -A so files deleted at the start of the run are staged too;
          # `git add GFS/*.json` only ever matches files that still exist
          git add -A GFS/

          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update GFS JSON ($YMD ${CYCLE}z)"

          # no history rewrite: a plain fast-forward push. If another workflow
          # pushed while this run was downloading, rebase and retry.
          git push origin main || {
            echo "push rejected - retrying on top of origin/main"
            MSG=$(git log -1 --pretty=%B)
            git fetch origin main
            git reset --soft FETCH_HEAD
            git commit -qm "$MSG"
            git push origin main
          }
