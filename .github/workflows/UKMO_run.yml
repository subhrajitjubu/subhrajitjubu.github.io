name: UKMO run

on:
  schedule:
    # every 6 hours. The archive publishes 00Z / 06Z / 12Z / 18Z with a few
    # hours of lag, so each tick picks up whatever run is newest at that moment
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write   # needed to push the generated JSON back to the repo

concurrency:
  # never let a scheduled run and a manual one fight over the same branch
  group: ukmo-run
  cancel-in-progress: false


env:
  # every variable that gets downloaded, cropped, merged and written to JSON
  VARS: >-
    cloud_amount_of_high_cloud,
    cloud_amount_of_low_cloud,
    cloud_amount_of_medium_cloud,
    cloud_amount_of_total_cloud,
    CAPE_surface,
    CIN_surface,
    relative_humidity_at_screen_level,
    relative_humidity_on_pressure_levels,
    precipitation_accumulation-PT01H,
    precipitation_rate,
    rainfall_accumulation-PT01H,
    rainfall_rate,
    rainfall_rate_from_convection,
    pressure_at_mean_sea_level,
    temperature_at_screen_level,
    temperature_at_screen_level_max-PT01H,
    temperature_at_screen_level_min-PT01H,
    temperature_at_surface,
    temperature_on_pressure_levels,
    wind_direction_at_10m,
    wind_direction_on_pressure_levels,
    wind_gust_at_10m,
    wind_gust_at_10m_max-PT01H,
    wind_speed_at_10m,
    wind_speed_on_pressure_levels

jobs:
  run-preprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check runner resources
        run: 
          nproc
          free -h
          df -h /
          
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # purge_history.sh rewrites history, so it needs the real history and
          # not a depth-1 shallow clone
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve the run
        run: |
          # newest run in the archive at this moment (LATEST would do the same,
          # this way the run id ends up in the log)
          RUN=$(python -c "import mo_aws; print(mo_aws.list_runs('global-deterministic-10km')[-1])")
          echo "run: $RUN"
          echo "RUN=$RUN" >> "$GITHUB_ENV"

      - name: Download, crop, merge and convert to JSON
        run: |
          # start from a clean slate: a different number of parts would otherwise
          # leave stale *_part03of03.json files behind
          mkdir -p UKMO
          find UKMO -maxdepth 1 -type f -name '*.json' -delete

          python mo_crop.py \
            --run "$RUN" \
            --lat 0 40 --lon 40 100 \
            --max-lead 4 \
            --out ./cropped \
            --to-json \
            # --merge   \
            --split-levels --plevels 850 500 200 \
            --periods PT01H \
            --max-json-mb 20 \
            --workers 12 \
            --vars "$VARS"

          # mo_crop writes the JSON next to the NetCDF files, nested under
          # cropped/global-deterministic-10km/<run>_cropped/ - flatten it into UKMO/
          find cropped -type f -name '*.json' -exec mv -f {} UKMO/ \;

          n=$(find UKMO -maxdepth 1 -type f -name '*.json' | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "no JSON was produced - failing instead of committing nothing"
            exit 1
          fi
          echo "$n JSON file(s) in UKMO/"
          du -sh UKMO/

      - name: Commit and push changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "subhrajitjubu"
          git config --global user.email "66462700+subhrajitjubu@users.noreply.github.com"
          git pull --no-rebase origin main

          # -A so files deleted at the start of the run are staged too;
          # `git add UKMO/*.json` only ever matches files that still exist
          git add -A UKMO/

          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Met Office JSON ($RUN)"

          # every earlier version of UKMO/*.json is stripped out of history and
          # garbage-collected, so .git stays the size of one run's data instead
          # of growing by ~0.5 GB per run. This rewrites history - hence --force.
          bash purge_history.sh UKMO

          git push --force origin main
