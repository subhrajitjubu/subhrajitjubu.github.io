name: Download and preprocess ADS__previous12UTC

on:
  schedule:
    - cron: '0 0 * * *'  # This runs every day at 10:00 UTC
  workflow_dispatch:  # Allows manual triggering
env:
  CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Create virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install jupyter nbconvert
          pip install -r requirements.txt  # Install your dependencies
      - name: pull repo
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "subhrajitjubu"
          git config --global user.email "66462700+subhrajitjubu@users.noreply.github.com"
          # other data workflows still rewrite history, so a merge-style
          # `git pull` aborts with exit 128 - just take the remote tip
          git fetch origin main
          git reset --hard FETCH_HEAD
      - name: Run Jupyter Notebook
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          source venv/bin/activate
          find srcc -type f -name '*.json' ! -name 'IND.json' -exec rm {} +
          ipython -c "%run srcc/plott_12.ipynb"
          
      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "subhrajitjubu"
          git config --global user.email "66462700+subhrajitjubu@users.noreply.github.com"

          # take the current remote tip (history may have been rewritten by the
          # GFS/UKMO purge), then wipe srcc again so only this run's data stays
          git fetch origin main
          git reset --hard FETCH_HEAD
          find srcc -type f -name '*.json' ! -name 'IND.json' -delete

          # notebook writes only *_partNNofNN.json + *_manifest.json; a bare
          # `mv *.json` also scoops up jobs_data.json from the Jobs workflow
          shopt -s nullglob
          for f in *_part*.json *_manifest.json; do mv "$f" srcc/; done

          git add -A srcc/
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update ECMWF JSON"

          # no history rewrite here: a plain fast-forward push. If another
          # workflow pushed while this run was downloading, rebase and retry.
          git push origin main || {
            echo "push rejected - retrying on top of origin/main"
            MSG=$(git log -1 --pretty=%B)
            git fetch origin main
            git reset --soft FETCH_HEAD
            git commit -qm "$MSG"
            git push origin main
          }
